<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seamless Dithered GPU Mesh Gradient</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #08090b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Full-bleed stage */
    .viewport-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* WebGL Canvas */
    #gl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Fallback element if WebGL is disabled/unsupported */
    #css-fallback {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #08090b 0%, #2f3237 35%, #8b9099 70%, #f3f4f6 100%);
      transition: background 0.8s ease;
    }

    /* Minimalist floating HUD */
    .hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.5rem, 3.5vw, 3rem);
      z-index: 10;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .brand-title {
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: rgba(255, 255, 255, 0.95);
      mix-blend-mode: difference;
    }

    .brand-caption {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
      mix-blend-mode: difference;
    }

    /* Palette Switcher Pill Bar */
    .palette-bar {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 9999px;
      background: rgba(15, 20, 28, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }

    .palette-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .palette-btn:hover {
      color: rgba(255, 255, 255, 0.95);
    }

    .palette-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .palette-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
      mix-blend-mode: difference;
    }
  </style>
</head>
<body>
  <div class="viewport-stage">
    <!-- WebGL Full-Bleed Canvas -->
    <canvas id="gl-canvas"></canvas>

    <!-- CSS Fallback for Non-WebGL Environments -->
    <div id="css-fallback"></div>

    <!-- Minimalist HUD & Palette Controls -->
    <div class="hud-overlay">
      <header class="hud-header">
        <div>
          <div class="brand-title">GPU Mesh Gradient</div>
          <div class="brand-caption">Double-Warped FBM &middot; 4&times;4 Bayer Dither</div>
        </div>

        <!-- Palettes Selector -->
        <div class="palette-bar" role="toolbar" aria-label="Palette Presets">
          <button type="button" class="palette-btn active" data-palette="noir">
            <span class="palette-dot" style="background: #8b9099;"></span> Noir
          </button>
          <button type="button" class="palette-btn" data-palette="mint">
            <span class="palette-dot" style="background: #9ccfb2;"></span> Mint
          </button>
          <button type="button" class="palette-btn" data-palette="plum">
            <span class="palette-dot" style="background: #e07a9c;"></span> Plum
          </button>
          <button type="button" class="palette-btn" data-palette="neon">
            <span class="palette-dot" style="background: #ff2f92;"></span> Neon
          </button>
        </div>
      </header>

      <footer class="hud-footer">
        <span>Circumnavigating Phase Space &middot; Seamless Loop</span>
        <span id="loop-phase">0.00 rad</span>
      </footer>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('gl-canvas');
      const fallback = document.getElementById('css-fallback');
      const phaseReadout = document.getElementById('loop-phase');
      const paletteBtns = document.querySelectorAll('.palette-btn');

      // Palette Stop Definitions (sRGB hex -> [0..1] vec3)
      function hexToRgb(hex) {
        const num = parseInt(hex.replace('#', ''), 16);
        return [
          ((num >> 16) & 255) / 255.0,
          ((num >> 8) & 255) / 255.0,
          (num & 255) / 255.0
        ];
      }

      const PALETTES = {
        noir: {
          hex: ['#08090b', '#2f3237', '#8b9099', '#f3f4f6'],
          stops: ['#08090b', '#2f3237', '#8b9099', '#f3f4f6'].map(hexToRgb)
        },
        mint: {
          hex: ['#f7f4e8', '#dcecd9', '#9ccfb2', '#5c9c85'],
          stops: ['#f7f4e8', '#dcecd9', '#9ccfb2', '#5c9c85'].map(hexToRgb)
        },
        plum: {
          hex: ['#180814', '#48103e', '#95275f', '#e07a9c'],
          stops: ['#180814', '#48103e', '#95275f', '#e07a9c'].map(hexToRgb)
        },
        neon: {
          hex: ['#04060a', '#7dff4d', '#ff2f92', '#29e6ff'],
          stops: ['#04060a', '#7dff4d', '#ff2f92', '#29e6ff'].map(hexToRgb)
        }
      };

      let activeKey = 'noir';
      let currentStops = PALETTES.noir.stops.map(c => [...c]);
      let targetStops = PALETTES.noir.stops.map(c => [...c]);

      // WebGL Context Initialization
      const gl = canvas.getContext('webgl', { antialias: false, powerPreference: 'high-performance' }) ||
                 canvas.getContext('experimental-webgl');

      if (!gl) {
        // Fallback to CSS linear-gradient
        canvas.style.display = 'none';
        fallback.style.display = 'block';
        updateCssFallback();
        return;
      }

      function updateCssFallback() {
        const hex = PALETTES[activeKey].hex;
        fallback.style.background = `linear-gradient(135deg, ${hex[0]} 0%, ${hex[1]} 35%, ${hex[2]} 70%, ${hex[3]} 100%)`;
      }

      // Vertex Shader: Passes single full-screen triangle straight through
      const vsSource = `
        attribute vec2 a_pos;
        varying vec2 v_uv;
        void main() {
          v_uv = a_pos * 0.5 + 0.5;
          gl_Position = vec4(a_pos, 0.0, 1.0);
        }
      `;

      // Fragment Shader: 2-stage domain warped FBM + 4x4 Bayer matrix dither + seamless circular sampling
      const fsSource = `
        precision highp float;

        varying vec2 v_uv;

        uniform vec2 u_resolution;
        uniform float u_t;
        uniform vec2 u_pointer;

        uniform vec3 u_c0;
        uniform vec3 u_c1;
        uniform vec3 u_c2;
        uniform vec3 u_c3;

        // 2D Value Noise Hash
        float hash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);

          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        // 5 octaves of value noise, each 2.02x frequency at half amplitude
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p = p * 2.02 + vec2(13.17, 19.31);
            a *= 0.5;
          }
          return v;
        }

        // 4x4 Bayer Ordered Dither Matrix centered to -0.5..0.5
        float bayer4(vec2 coord) {
          vec2 p = floor(mod(coord, 4.0));
          float d = 0.0;
          if (p.y < 0.5) {
            d = (p.x < 0.5) ? 0.0 : (p.x < 1.5) ? 8.0 : (p.x < 2.5) ? 2.0 : 10.0;
          } else if (p.y < 1.5) {
            d = (p.x < 0.5) ? 12.0 : (p.x < 1.5) ? 4.0 : (p.x < 2.5) ? 14.0 : 6.0;
          } else if (p.y < 2.5) {
            d = (p.x < 0.5) ? 3.0 : (p.x < 1.5) ? 11.0 : (p.x < 2.5) ? 1.0 : 9.0;
          } else {
            d = (p.x < 0.5) ? 15.0 : (p.x < 1.5) ? 7.0 : (p.x < 2.5) ? 13.0 : 5.0;
          }
          return (d / 16.0) - 0.5;
        }

        void main() {
          // Aspect-ratio-corrected coordinate space
          vec2 p = v_uv * vec2(u_resolution.x / u_resolution.y, 1.0) * 1.7;

          // Parallax offset from eased pointer
          p += u_pointer * 0.22;

          // SEAMLESS LOOP: circular sampling trajectory
          vec2 orb = vec2(cos(u_t), sin(u_t)) * 0.55;

          // DOMAIN WARPING (Two passes)
          // Pass 1:
          vec2 q = vec2(
            fbm(p + orb),
            fbm(p + orb.yx + vec2(3.1, 3.1))
          );

          // Pass 2:
          vec2 r = vec2(
            fbm(p + 2.0 * q + orb * 1.3 + vec2(1.7, 1.7)),
            fbm(p + 2.0 * q - orb + vec2(9.2, 9.2))
          );

          // Final evaluated field
          float f = fbm(p + 1.8 * r);

          // Remap field to 0..1
          float g = clamp((f - 0.14) / 0.72, 0.0, 1.0);
          float s = length(q);

          // Four stops mixed with soft overlapping smoothstep windows
          vec3 col = mix(u_c0, u_c1, smoothstep(0.0, 0.45, g));
          col = mix(col, u_c2, smoothstep(0.35, 0.78, g));
          col = mix(col, u_c3, smoothstep(0.62, 1.0, g) * (0.55 + 0.45 * s));

          // 4x4 Bayer matrix ordered dither (scaled to 0.016 to prevent color banding)
          col += bayer4(gl_FragCoord.xy) * 0.016;

          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
      `;

      function createShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
      const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
        return;
      }

      gl.useProgram(program);

      // Full-screen triangle: (-1,-1, 3,-1, -1,3)
      const positions = new Float32Array([
        -1.0, -1.0,
         3.0, -1.0,
        -1.0,  3.0
      ]);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

      const aPos = gl.getAttribLocation(program, 'a_pos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      // Uniform Locations
      const uResolution = gl.getUniformLocation(program, 'u_resolution');
      const uTime = gl.getUniformLocation(program, 'u_t');
      const uPointer = gl.getUniformLocation(program, 'u_pointer');
      const uC0 = gl.getUniformLocation(program, 'u_c0');
      const uC1 = gl.getUniformLocation(program, 'u_c1');
      const uC2 = gl.getUniformLocation(program, 'u_c2');
      const uC3 = gl.getUniformLocation(program, 'u_c3');

      // Pointer & Resize Tracking
      const targetPointer = { x: 0.0, y: 0.0 };
      const easedPointer = { x: 0.0, y: 0.0 };
      let u_t = 0.0;
      const TWO_PI = Math.PI * 2.0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uResolution, canvas.width, canvas.height);
      }

      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('pointermove', (e) => {
        targetPointer.x = (e.clientX / window.innerWidth - 0.5) * 2.0;
        targetPointer.y = -(e.clientY / window.innerHeight - 0.5) * 2.0;
      }, { passive: true });

      // Palette Selection Handling
      paletteBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.palette;
          if (PALETTES[key]) {
            activeKey = key;
            targetStops = PALETTES[key].stops.map(c => [...c]);
            paletteBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateCssFallback();
          }
        });
      });

      // Render Loop
      let lastTimestamp = performance.now();

      function render(now) {
        requestAnimationFrame(render);

        const delta = Math.min((now - lastTimestamp) * 0.001, 0.1);
        lastTimestamp = now;

        // Advance circular loop phase
        u_t += delta * 0.38;
        if (u_t >= TWO_PI) {
          u_t -= TWO_PI;
        }

        phaseReadout.textContent = `${u_t.toFixed(2)} / ${(TWO_PI).toFixed(2)} rad`;

        // Ease pointer parallax
        easedPointer.x += (targetPointer.x - easedPointer.x) * 0.06;
        easedPointer.y += (targetPointer.y - easedPointer.y) * 0.06;

        // Smoothly interpolate palette colors
        for (let i = 0; i < 4; i++) {
          for (let c = 0; c < 3; c++) {
            currentStops[i][c] += (targetStops[i][c] - currentStops[i][c]) * 0.08;
          }
        }

        // Upload uniforms
        gl.uniform1f(uTime, u_t);
        gl.uniform2f(uPointer, easedPointer.x, easedPointer.y);
        gl.uniform3fv(uC0, currentStops[0]);
        gl.uniform3fv(uC1, currentStops[1]);
        gl.uniform3fv(uC2, currentStops[2]);
        gl.uniform3fv(uC3, currentStops[3]);

        // Draw full-screen single triangle
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
